# ═══════════════════════════════════════════════════════════════════════════════
# Visual FaQtory v0.9.4-beta — Local MLX backend example config
# ═══════════════════════════════════════════════════════════════════════════════
#
# Copy to worqspace/config.yaml (or: python vfaq_cli.py run --config this-file)
# to run FLUX.1-dev, FLUX.1 Kontext, Wan 2.2 and Z-Image-Turbo locally on
# Apple Silicon.
#
# Recommended, working-out-of-the-box path: use the `mflux` runner for the
# three image models (Z-Image-Turbo, FLUX.1-dev, FLUX.1 Kontext). It is
# installed with `pip install mflux` and its command names are on your PATH
# inside the project virtualenv. Wan 2.2 video uses the `wan` runner
# (SceneWorks `mlx-gen-wan`), which is a separate native tool.
# ═══════════════════════════════════════════════════════════════════════════════

paths:
  output_dir: ./run
  briqs_dir: ./run/briqs

backend:
  type: local
  timeout: 3600

image_backend:
  type: local

video_backend:
  type: local

morph_backend:
  type: local

input:
  mode: text                      # text | image | video

# ─────────────────────────────────────────────────────────────────────────────
# Local backend configuration
# ─────────────────────────────────────────────────────────────────────────────
local:
  # Default runner for image models. Supported runners:
  #   mflux       (recommended) Z-Image-Turbo / FLUX.1-dev / FLUX.1-Kontext
  #   flux-swift  flux.swift-format checkpoints (mzbac/flux1.*.4bit.mlx)
  #   wan         SceneWorks mlx-gen-wan (Wan 2.2 video)
  #   command     fully custom shell templates
  runner: mflux

  timeout: 3600                   # Per-generation timeout in seconds
  width: 1024
  height: 576
  steps: 8                        # Z-Image-Turbo uses 8; FLUX dev/Kontext use ~25
  fps: 8
  quantize: 4                     # mflux quantization (4=4bit, 8=8bit, auto/empty = model default)

  # Capability → model mapping.
  models:
    image: z-image-turbo          # z-image-turbo | flux-1-dev
    video: wan-2.2
    edit: flux-1-kontext

  # The model spec passed to the runner. For `mflux` this may be a local path,
  # an mflux-compatible HuggingFace repo id ("org/name"), or a built-in mflux
  # model name ("z-image-turbo", "dev", "dev-kontext"). For `flux-swift` and
  # `wan` it must be an on-disk directory/checkpoint.
  #
  # NOTE ON YOUR ~/Qoding/ai CHECKPOINTS:
  #   flux1.dev.4bit.mlx  / flux1.kontext.4bit.mlx  → flux.swift format
  #   Z-Image-Turbo-MLX-4bit                        → diffusers-MLX (andrevp) format
  #   wan2.2-ti2v-5b-mlx                            → SceneWorks format
  # Those three formats are NOT readable by mflux. To use them directly, set
  # `model_runners.flux-1-dev/flux-1-kontext` to `flux-swift`, and
  # `model_runners.wan-2.2` to `wan`, then install the matching tools.
  # For a zero-friction mflux run, point the image models at mflux-compatible
  # sources (the commented-out values below).
  model_paths:
    flux-1-dev: ~/Qoding/ai/flux1.dev.4bit.mlx
    flux-1-kontext: ~/Qoding/ai/flux1.kontext.4bit.mlx
    wan-2.2: ~/Qoding/ai/wan2.2-ti2v-5b-mlx
    z-image-turbo: ~/Qoding/ai/Z-Image-Turbo-MLX-4bit
    # mflux-compatible sources (uncomment to use instead of the ~/Qoding/ai paths):
    # flux-1-dev: dev
    # flux-1-kontext: dev-kontext
    # z-image-turbo: z-image-turbo

  # Per-model runner overrides (optional). Leave commented to use the default
  # `runner` above for every model.
  # model_runners:
  #   flux-1-dev: mflux
  #   flux-1-kontext: mflux
  #   z-image-turbo: mflux
  #   wan-2.2: wan

  # Runner-specific settings.
  mflux:
    executable: mflux-generate    # base executable (the model-specific CLIs are derived)
    # quantize: 4                  # optional; defaults to local.quantize

  flux_swift:
    executable: flux.swift.cli
    hf_token_env: HF_TOKEN        # env var holding your Hugging Face token (gated models)

  wan:
    executable: mlx-gen-wan       # SceneWorks native Wan 2.2 worker

  # Fully custom command runner example (unused unless runner/command chosen):
  # command:
  #   executable: my-local-generator
  #   image_template: "my-local-generator image --prompt {prompt} --output {output}"
  #   video_template: "my-local-generator video --prompt {prompt} --image {input_image} --output {output}"
  #   morph_template: "my-local-generator morph --start {start_image} --end {end_image} --output {output}"

paragraph_story:
  max_paragraphs: 2
  img2vid_duration_sec: 5
  video_fps: 24
  seed_base: 0
  rolling_window: true
  require_morph: true
  enable_loop_closure: false
  img2img_denoise_min: 0.44
  img2img_denoise_max: 0.66
  reinject: true
  smart_reinject_enabled: false

finalizer:
  enabled: true
  per_cycle_pingpong: false
  per_cycle_interpolation: false
  upscale_resolution: 1280x720
  interpolate_fps: 30
  post_run_interpolation: true
  post_run_pingpong: false
  post_interpolate_fps: 60
  quality:
    crf: 11
    encoder_preference: auto

audio:
  enabled: false
  sync_video_audio: false
  cycle_seconds: 5
  # bpm: 128
  # beats_per_cycle: 4

image_metrics:
  enabled: false
