# ═══════════════════════════════════════════════════════════════════════════════
# Visual FaQtory v0.9.5-beta — LOCAL config (mflux images + MLX-Gen Wan 2.2 TI2V-5B-Turbo)
# ═══════════════════════════════════════════════════════════════════════════════
# Image : FLUX.1-dev via mflux (local, Apple Silicon MLX)
# Edit  : FLUX.1 Kontext via mflux (local, Apple Silicon MLX)
# Video : Wan 2.2 TI2V-5B-Turbo (Self-Forcing 4-step distill) via MLX-Gen (`mlx-gen`).
#
#         Wan 2.2 video does NOT run through mflux's `mflux-generate` (it is
#         image-only). It runs through the `wan` runner, whose executable is
#         `mlx-gen` — NOT the `command` runner, NOT SceneWorks/scenemodel.
#
#         This is the Self-Forcing Wan2.2-TI2V-5B-Turbo 4-step distill:
#         denoising_step_list=[1000,750,500,250], guidance=1, solver=unipc.
#         No LoRAs, no CFG trick.
# Crowd Control : disabled
# ═══════════════════════════════════════════════════════════════════════════════

paths:
  output_dir: ./run
  briqs_dir: ./run/briqs

# ─────────────────────────────────────────────────────────────────────────────
# Backend routing: everything local.
# ─────────────────────────────────────────────────────────────────────────────
backend:
  type: local
  timeout: 3600

image_backend:
  type: local
  width: 1024
  height: 576

video_backend:
  type: local
  width: 1024
  height: 576

morph_backend:
  type: local
  width: 1024
  height: 576

input:
  mode: text

# ─────────────────────────────────────────────────────────────────────────────
# LOCAL MLX BACKEND
# ─────────────────────────────────────────────────────────────────────────────
local:
  runner: mflux
  timeout: 3600
  width: 1024
  height: 576
  steps: 30
  # FLUX.1-dev / FLUX.1 Kontext use ~25-30 steps; Z-Image-Turbo would use 8.
  fps: 24
  quantize: 4

  models:
    image: flux-1-dev
    video: wan-2.2
    edit: flux-1-kontext

  # Per-model runner overrides.
  #   - mflux  -> FLUX image models (mflux-generate)
  #   - wan    -> MLX-Gen (`mlx-gen generate`) for Wan 2.2 video.
  #               This is NOT `mflux`, NOT `command`, NOT `sceneworks`.
  model_runners:
    flux-1-dev: mflux
    flux-1-kontext: mflux
    z-image-turbo: mflux
    wan-2.2: wan            # mlx-gen (MLX-Gen) — Wan 2.2 video

  # mflux-compatible image model specs (HuggingFace repo ids; already cached).
  # Wan 2.2 video points at the locally-converted Self-Forcing 5B Turbo
  # checkpoint (diffusers key layout for MLX-Gen).
  model_paths:
    flux-1-dev: /Users/wicked/models/flux.1-dev-mflux-4bit
    flux-1-kontext: /Users/wicked/models/flux.1-kontext-mflux-4bit
    z-image-turbo: filipstrand/Z-Image-Turbo-mflux-4bit
    wan-2.2: /Users/wicked/models/Wan2.2-TI2V-5B-Turbo-mlxgen

  mflux:
    executable: mflux-generate

  wan:
    executable: mlx-gen
    denoising_step_list: [1000, 750, 500, 250]
    guidance: 1
    solver: unipc
    low_ram: true
    max_frames: 121
    mlx_cache_limit_gb: 27

# ─────────────────────────────────────────────────────────────────────────────
# SLIDING WINDOW STORY ENGINE
# ─────────────────────────────────────────────────────────────────────────────
paragraph_story:
  max_paragraphs: 2
  max_cycles: 1          # test cap: only generate 1 cycle (set 0 to disable)
  img2vid_duration_sec: 5
  video_fps: 24
  seed_base: 0
  rolling_window: true
  require_morph: false
  enable_loop_closure: false
  img2img_denoise_min: 0.44
  img2img_denoise_max: 0.66
  reinject: true
  smart_reinject_enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# FINALIZER
# ─────────────────────────────────────────────────────────────────────────────
finalizer:
  enabled: true
  per_cycle_pingpong: false
  per_cycle_interpolation: false
  upscale_resolution: 1280x720
  interpolate_fps: 30
  scale_algo: bicubic
  post_run_interpolation: true
  post_run_pingpong: false
  post_interpolate_fps: 60
  quality:
    crf: 11
    encoder_preference: auto

# ─────────────────────────────────────────────────────────────────────────────
# AUDIO
# ─────────────────────────────────────────────────────────────────────────────
audio:
  enabled: false
  sync_video_audio: false
  cycle_seconds: 5

# ─────────────────────────────────────────────────────────────────────────────
# IMAGE METRICS
# ─────────────────────────────────────────────────────────────────────────────
image_metrics:
  enabled: false

# ─────────────────────────────────────────────────────────────────────────────
# CROWD CONTROL — DISABLED for the local test run
# ─────────────────────────────────────────────────────────────────────────────
crowd_control:
  enabled: false
  base_url: "http://127.0.0.1:8000/visuals"
  pop_token: "${VF_CROWD_TOKEN}"
  timeout_seconds: 1.0
  inject_label: "Audience mutation request"
  inject_mode: "replace"
  inject_source_mode: "as_reference"
  bake_mode: "direct_video"
  bake_use_morph: false
  bake_denoise_min: 0.58
  bake_denoise_max: 0.82
  bake_prompt_prefix: "AUDIENCE PROMPT IS THE PRIMARY VISUAL MUTATION. Strongly transform the scene to match this request while preserving enough continuity from the source image:"
  discard_smart_prefetch_on_crowd: true
  claim_timeout_seconds: 900
  ack_after_success: true
  requeue_on_failure: true
  max_chars: 300
  rate_limit_seconds: 60
  max_queue: 100
  badwords_path: "worqspace/badwords.txt"
  public_url: "https://wonq.tv/visuals"
  prefix: "/visuals"
  db_path: "worqspace/crowdcontrol.sqlite3"
